{% extends 'admin/_base.html' %}
{% block titulo %}Entrar{% endblock %}

{% block contenido %}
<div class="login-caja">
    <h1>Panel de Semilla</h1>
    <p class="login-texto">Escribí la contraseña para administrar el catálogo.</p>

    {% if error %}
    <p class="aviso aviso-error">
        <svg class="ico" aria-hidden="true"><use href="#ico-cerrar"></use></svg>
        {{ error }}
    </p>
    {% endif %}

    <form method="post" class="form-admin">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label class="campo">
            <span class="campo-titulo">Contraseña</span>
            <input type="password" name="password" autocomplete="current-password"
                   autofocus required>
        </label>

        <button type="submit" class="btn-primario">Entrar</button>
    </form>

    <p class="login-pie">
        <a href="{{ url_for('inicio') }}">Volver a la tienda</a>
    </p>
</div>
{% endblock %}
